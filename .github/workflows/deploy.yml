name: Deploy to wordpress.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The version lives in four places. A release where they disagree ships a
      # package the plugin directory reads one way and the update checker reads
      # another, so this runs before anything is published and fails the whole
      # job rather than warning about it.
      - name: Check that every version agrees with the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not of the form vX.Y.Z."
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#v}"

          HEADER_VERSION=$(awk '/^ \* Version:/ { print $3; exit }' rotate-everything.php)
          CONSTANT_VERSION=$(awk -F"'" '/^define\( .ROTATE_EVERYTHING_VERSION./ { print $4; exit }' rotate-everything.php)
          README_VERSION=$(awk '/^Stable tag:/ { print $3; exit }' readme.txt)

          echo "Git tag .................. $TAG_VERSION"
          echo "Plugin header ............ $HEADER_VERSION"
          echo "ROTATE_EVERYTHING_VERSION  $CONSTANT_VERSION"
          echo "readme.txt Stable tag .... $README_VERSION"

          STATUS=0
          for pair in "plugin header:$HEADER_VERSION" \
                      "ROTATE_EVERYTHING_VERSION:$CONSTANT_VERSION" \
                      "readme.txt Stable tag:$README_VERSION"; do
            label="${pair%%:*}"
            value="${pair#*:}"
            if [[ -z "$value" ]]; then
              echo "::error::Could not read the version from the $label."
              STATUS=1
            elif [[ "$value" != "$TAG_VERSION" ]]; then
              echo "::error::The $label says '$value' but the tag says '$TAG_VERSION'."
              STATUS=1
            fi
          done

          exit "$STATUS"

      # The action reads .distignore itself to build what it commits, and pushes
      # .wordpress-org/ to SVN's assets/ directory. The two secrets are created
      # by hand by the maintainer; see CONTRIBUTING.md. Until they exist this
      # step fails, which is the correct outcome.
      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: rotate-everything
